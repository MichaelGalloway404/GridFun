<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Peggle Canvas Game</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #0b0b0c;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            overflow: hidden;
            font-family: sans-serif;
        }

        /* Container scales fluidly on mobile/tablets while maintaining aspect ratio */
        .game-container {
            width: 100%;
            max-width: 800px;
            aspect-ratio: 4 / 3;
            padding: 10px;
            box-sizing: border-box;
        }

        canvas {
            width: 100%;
            height: 100%;
            background-color: #121214;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
            border-radius: 8px;
            display: block;
            touch-action: none; /* Prevents default browser panning and zooming behaviors */
        }
    </style>
</head>
<body>

    <canvas id="gameCanvas" width="1000" height="600"></canvas>
<script src="./script.js"></script>
</body>
</html>
